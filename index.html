<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:13px system-ui,sans-serif}
body{display:flex;flex-direction:column}

input[type=text]{width:110px;cursor:text}input[type=number]{width:40px;padding:5px 3px;cursor:text}input[type=color]{width:100%;height:30px;border:1px solid var(--b);padding:1px;background:none;cursor:pointer}
.sep{width:1px;height:22px;background:var(--b)}.grp{display:inline-flex;gap:3px;align-items:center}
kbd{font:10px ui-monospace,monospace;opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 4px}

#main{flex:1;display:flex;min-height:0}
#left{width:128px;flex:none;background:var(--p);border-right:1px solid var(--b);padding:8px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.6;margin:0 0 3px 2px}
.tg{display:flex;flex-direction:column;gap:3px}
#left button{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;width:100%;box-sizing:border-box}
#wrap{flex:1;position:relative;min-height:0;min-width:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

#rp details{border-bottom:1px solid var(--b);padding:7px 9px}#rp summary{cursor:pointer;font-weight:600;margin-bottom:2px}

#pp{display:none;flex-direction:column;gap:6px;border-bottom:1px solid var(--b);padding:9px;background:rgba(47,143,209,.08)}
