<style>

(()=>{

    const row=document.createElement('div'); row.className='fld';

    const select=document.createElement('select'); select.id='floorView'; select.style.width='100%';

    select.value=floorView||'fade'; select.onchange=()=>{floorView=select.value;slice=floorView!=='all';$('slice').classList.toggle('on',slice);draw()};
    row.append(label,select); const old=$('slice').parentElement; old.after(row);
  }
  // Click an existing item while using a geometry creation tool: select it instead of
  // accidentally placing another item on top. Annotation tools (comments, icons, text, dots)
  // deliberately bypass this so they can be placed over existing objects.
  let addingToCube=false;
  const priorDown=cv.onpointerdown;
  cv.onpointerdown=function(e){
    if(e.button===0 && !addingToCube && !['sel','del','poly','sq','cm','icon','txt','dot'].includes(tool)){

    }

  // Ensure the selected colour picker tracks the active selection after auto-select.
  const oldSync=sync; sync=function(){oldSync();if(sel!=null&&I[sel]&&I[sel].c)$('col').value=I[sel].c};

  // A shape drawn on a cube should remain legible. Use a hue-shifted colour
  // only when the requested colour is effectively the same as the host cube.
  const hexRgb=h=>{const n=parseInt((h||'#3b9ae1').replace('#',''),16);return[(n>>16)&255,(n>>8)&255,n&255]};
  const dist=(a,b)=>Math.sqrt(a.reduce((v,x,i)=>v+(x-b[i])**2,0));
  const contrast=c=>{const [r,g,b]=hexRgb(c);let hsl=(function(){const R=r/255,G=g/255,B=b/255,ma=Math.max(R,G,B),mi=Math.min(R,G,B),d=ma-mi;let h=0,s=ma===0?0:d/(1-Math.abs(2*((ma+mi)/2)-1)),l=(ma+mi)/2;if(d){if(ma===R)h=((G-B)/d)%6;else if(ma===G)h=(B-R)/d+2;else h=(R-G)/d+4;h*=60;if(h<0)h+=360}return[h,s,l]})();

     grid.append(field('Depth',e[3]-e[2],{min:'.05',onchange:n=>update(()=>{const q=LPX.E(o).slice();q[3]=q[2]+Math.max(.05,n);LPX.setE(o,q)})}));
   }else if(o.t==='arr'){
     grid.append(field('End X',o.x2,{onchange:n=>update(()=>o.x2=n)}));
     grid.append(field('End Y',o.y2,{onchange:n=>update(()=>o.y2=n)}));
   }else if(o.t==='door'){
     grid.append(field('Width',o.len||1,{min:'1',max:'4',step:'1',onchange:n=>update(()=>o.len=cl(Math.round(n),4)||1)}));
   }else if(o.t==='poly'){
     const n=document.createElement('div');n.className='inspector-note inspector-wide';n.textContent=(o.pts||[]).length+' vertices';grid.append(n);
   }
   if(o.t==='txt')body.append(textField('Text',o.s,v=>update(()=>o.s=v)));
   else if(['dot','icon','poly'].includes(o.t)&&o.lb!==undefined)body.append(textField('Label',o.lb,v=>update(()=>o.lb=v)));
   body.append(section('Appearance'),colorField(o));
   const actions=document.createElement('div');actions.className='inspector-actions';
   const duplicate=mk('Duplicate',()=>{dup();render()});const remove=mk('Delete',()=>{del();render()});
   actions.append(duplicate,remove);body.append(actions);
 }
 const oldDraw=draw;draw=function(){oldDraw();render()};
 const oldSync=sync;sync=function(){oldSync();render()};
 render();
})();
</script>
